name: reference-boundary

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make check
      - name: Prove startup remains denied
        run: |
          set +e
          ./start.sh
          code=$?
          set -e
          test "$code" = 78
